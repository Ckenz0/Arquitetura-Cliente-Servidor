name: Build and deploy Entrelinhas API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - 'scripts/package_backend.py'
      - 'requirements*.txt'
      - 'startup.sh'
      - 'pytest.ini'
      - '.python-version'
      - '.github/workflows/main_entrelinhas-api-ckenz0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entrelinhas-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            server/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test domain, API and contract
        run: python -m pytest -q -m 'not interface'

      - name: Package backend
        run: python scripts/package_backend.py --output dist/backend-azure.zip

      - name: Check Azure configuration
        id: azure-config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          if [[ -n "$AZURE_CLIENT_ID" && -n "$AZURE_TENANT_ID" && -n "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Backend validated and packaged. Azure identity configuration is pending; deployment was skipped.'
          fi

      - name: Login to Azure
        if: github.ref == 'refs/heads/main' && steps.azure-config.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        if: github.ref == 'refs/heads/main' && steps.azure-config.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: entrelinhas-api-ckenz0
          package: dist/backend-azure.zip
          startup-command: bash startup.sh
