name: Build and deploy Entrelinhas API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - 'scripts/package_backend.py'
      - 'requirements*.txt'
      - 'startup.sh'
      - 'pytest.ini'
      - '.python-version'
      - '.github/workflows/main_entrelinhas-api-ckenz0.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entrelinhas-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            server/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test domain, API and contract
        run: python -m pytest -q -m 'not interface'

      - name: Package backend
        run: python scripts/package_backend.py --output dist/backend-azure.zip

      - name: Check Azure configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}
        shell: bash
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_API_BASE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. See docs/deploy.md. Deployment is not configured."
              exit 1
            fi
          done

      - name: Login to Azure
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: entrelinhas-api-ckenz0
          package: dist/backend-azure.zip
          startup-command: bash startup.sh

      - name: Verify public API health
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AZURE_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 \
            --retry-all-errors --max-time 30 "${AZURE_API_BASE_URL%/}/api/health" \
            | python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
